oss deserves its own check", "before": "1,000 samples", "after": "1 sample\n\u201csmall\u201d effect", "fix": "Assess adequacy independently of a stable estimate.", "source": "https://github.com/a7ussein/readyset-control-tower/blob/4dd07736e99f96dd46cb6199c32bea32465bd20e/control_tower/compare.py#L303", "notes": "Helper-only probe: the difference remains 2.9, while count drops by 99.9%. This is not a full real-data cohort run. A statistician should set task-specific adequacy criteria.", "status": "REPRODUCED", "kind": "compare"}, {"title": "5 \u00b7 Timestamps change the answer", "before": "Plain TSV newer\nReady", "after": "Gzip newer\nConditional", "fix": "Resolve conflicting filenames explicitly.", "source": "https://github.com/a7ussein/readyset-control-tower/blob/4dd07736e99f96dd46cb6199c32bea32465bd20e/control_tower/release.py#L33", "notes": "Same file contents in both runs; only modification times changed. The candidate-selection rule chooses the newest file. Reject conflicts or record explicit selection.", "status": "REPRODUCED", "kind": "compare"}, {"title": "6 \u00b7 A blank reviewer is accepted", "before": "Direct API request\nNo reviewer name", "after": "HTTP 200\nReview requirement cleared", "fix": "Enforce reviewer validation on the server.", "source": "https://github.com/a7ussein/readyset-control-tower/blob/4dd07736e99f96dd46cb6199c32bea32465bd20e/control_tower/webserver.py#L258", "notes": "The UI correctly requires a name. The direct loopback API accepts confirmed plus approved without one. This is not a claim of remote exploitation.", "status": "REPRODUCED", "kind": "compare"}, {"title": "7 \u00b7 Clearing erases the record", "before": "Confirm \u2192 dismiss", "after": "Clear\n0 stored decisions", "fix": "Preserve an event for every change and withdrawal.", "source": "https://github.com/a7ussein/readyset-control-tower/blob/4dd07736e99f96dd46cb6199c32bea32465bd20e/control_tower/webserver.py#L270", "notes": "The current-state dictionary overwrites and removes records. Comparison history is separate and also replaces prior state. Evidence fingerprints are a strength to retain.", "status": "REPRODUCED", "kind": "compare"}, {"title": "Cloud routing already has disclosure", "before": "Typed question\nMocked request", "after": "No findings attached\nNo live API call", "fix": "Add a warning against confidential text in questions.", "source": "https://github.com/a7ussein/readyset-control-tower/blob/4dd07736e99f96dd46cb6199c32bea32465bd20e/web/src/Ask.tsx#L209", "notes": "Corrected earlier suspicion: the UI explicitly discloses Anthropic routing. No missing-disclosure or actual-leak claim is supported. Provider safeguards are prospective improvements.", "status": "SOURCE + MOCK", "kind": "compare"}, {"title": "The proposed repair sequence", "before": "Input validity\nAnalysis availability", "after": "Deterministic source\nReview history", "fix": "Then refine precision, zero handling and adequacy.", "source": "REPORT.md", "notes": "Use the detailed report for acceptance checks and source lines. Preserve the efficient change detector, evidence links and question-specific behavior.", "status": "RECOMMENDATION", "kind": "compare"}, {"title": "The next review needs real evidence", "before": "Seven official criteria", "after": "No invented score", "fix": "Unseen-input performance and clinical validity remain unverified.", "source": "REPORT.md", "notes": "Frozen public A versus itself returned Ready with zero findings through the identical-file shortcut. No sealed judging input or clinical validity was tested.", "status": "LIMITS", "kind": "compare"}],root=document.getElementById('deck'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
